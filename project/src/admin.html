<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | KöhrerGainz</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

            <!-- NAVIGATION -->
    <nav class="navbar">
    <div class="container">
        <button class="hamburger" aria-label="Menü">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-current-page">HOME</div>
        <a href="index.html" class="nav-logo">
            <span>KÖHRER</span><span class="logo-accent">GAINZ</span>
        </a>
        <a href="cart.html" class="nav-icon-btn" title="Warenkorb">
            🛒
            <span class="cart-count" data-count="0">0</span>
        </a>
        <a href="auth.html" class="nav-icon-btn nav-user-btn" title="Login">👤</a>
    </div>
    <div class="nav-links">
        <a href="index.html" class="active">Home</a>
        <a href="products.html">Produkte</a>
        <a href="calculator.html">Rechner</a>
        <a href="faq.html">FAQ</a>
        <a href="ueber-uns.html">Über uns</a>
    </div>
</nav>
<button class="theme-toggle" onclick="App.toggleTheme()" title="Theme wechseln" aria-label="Theme">☀️</button>
    

    <!-- CONTENT -->
    <div class="page-content" style="padding-top: calc(var(--nav-height) + 1rem);">
        <div class="admin-layout">
            <!-- Sidebar -->
            <div class="admin-sidebar">
                <h3>Admin Panel</h3>
                <button class="admin-menu-item active" data-section="dashboard">📊 Dashboard</button>
                <button class="admin-menu-item" data-section="products">📦 Produkte</button>
                <button class="admin-menu-item" data-section="orders">🧾 Bestellungen</button>
                <button class="admin-menu-item" data-section="users">👥 Benutzer</button>
                <button class="admin-menu-item" data-section="newsletter">📧 Newsletter</button>
            </div>

            <!-- Content -->
            <div class="admin-content">
                <!-- Dashboard -->
                <div id="admin-dashboard" class="admin-section">
                    <h2 style="margin-bottom: 1.5rem;">Dashboard</h2>
                    <div class="admin-stats">
                        <div class="stat-card">
                            <div class="stat-icon">📦</div>
                            <div class="stat-value" id="statProducts">0</div>
                            <div class="stat-label">Produkte</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">🧾</div>
                            <div class="stat-value" id="statOrders">0</div>
                            <div class="stat-label">Bestellungen</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">👥</div>
                            <div class="stat-value" id="statUsers">0</div>
                            <div class="stat-label">Benutzer</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">💰</div>
                            <div class="stat-value" id="statRevenue">€0</div>
                            <div class="stat-label">Umsatz</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">📧</div>
                            <div class="stat-value" id="statNewsletter">0</div>
                            <div class="stat-label">Newsletter</div>
                        </div>
                    </div>

                    <h3 style="margin-bottom: 1rem;">Letzte Bestellungen</h3>
                    <div id="recentOrders"></div>
                </div>

                <!-- Products -->
                <div id="admin-products" class="admin-section d-none">
                    <div id="adminProductList"></div>
                </div>

                <!-- Orders -->
                <div id="admin-orders" class="admin-section d-none">
                    <h2 style="margin-bottom: 1.5rem;">Bestellungen</h2>
                    <div id="adminOrderList"></div>
                </div>

                <!-- Users -->
                <div id="admin-users" class="admin-section d-none">
                    <h2 style="margin-bottom: 1.5rem;">Benutzer</h2>
                    <div id="adminUserList"></div>
                </div>

                <!-- Newsletter -->
                <div id="admin-newsletter" class="admin-section d-none">
                    <h2 style="margin-bottom: 1.5rem;">Newsletter Abonnenten</h2>
                    <div id="adminNewsletterList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/cookie.js"></script>

</body>
</html>
