services:
  db:
    image: mysql:8.4
    container_name: fitness_shop_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: fitness_shop
      MYSQL_USER: fitness_user
      MYSQL_PASSWORD: fitness_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitness_shop_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./frontend:/var/www/html
      - ./backend/api:/var/www/html/api
      - ./backend/config:/var/www/html/config
    ports:
      - "8080:80"

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: fitness_shop_phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_AUTH_TYPE: cookie
    ports:
      - "8082:80"

volumes:
  db_data:
